name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: "lts"
          cache: true

      - name: Resolve base path
        id: base
        run: |
          repo="${{ github.repository }}"
          owner="${{ github.repository_owner }}"
          name="${{ github.event.repository.name }}"
          if [ "$repo" != "${owner}/${owner}.github.io" ]; then
            echo "value=/${name}/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/" >> "$GITHUB_OUTPUT"
          fi

      - run: vp build --base "${{ steps.base.outputs.value }}"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
